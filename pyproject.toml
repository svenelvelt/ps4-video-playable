[project]
name = "ps4-video-playable"
version = "0.1.0"
description = "Check and convert video files for the PS4 Media Player"
readme = "README.md"
authors = [{ name = "Sven Elvelt", email = "125601311+svenelvelt@users.noreply.github.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["ps4", "playstation", "ffmpeg", "video", "media-player"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.scripts]
ps4-check = "ps4_video_playable.check:main"
ps4-convert = "ps4_video_playable.convert:main"

[project.urls]
Repository = "https://github.com/svenelvelt/ps4-video-playable"
Issues = "https://github.com/svenelvelt/ps4-video-playable/issues"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "PT",   # pytest style
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "e2e: runs ffmpeg on generated clips (deselect with -m 'not e2e')",
]
